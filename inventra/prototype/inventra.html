<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventra — Restaurant Inventory (Test Build)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F1;--surface:#FFFFFF;--surface2:#F8F9F5;--line:#E6E8E0;--line2:#EEF0EA;
  --ink:#18201C;--muted:#5F6862;--nav:#FFFFFF;--navInk:#4B544E;--navActive:#E7F4EC;--navActiveInk:#11593D;
  --accent:#17865A;--accentInk:#FFFFFF;--accentSoft:#E7F4EC;--accentDeep:#11593D;
  --red:#B3261E;--redSoft:#FDECEA;--amber:#8A5300;--amberSoft:#FFF3DC;--graySoft:#F0F2EC;--blue:#1F5FA8;--blueSoft:#E8F0FB;
  --shadow:0 1px 2px rgba(24,32,28,.05),0 4px 16px rgba(24,32,28,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513;--surface:#191E1B;--surface2:#1E2420;--line:#2B332E;--line2:#232A26;
  --ink:#ECF1ED;--muted:#A3ADA6;--nav:#151A17;--navInk:#B6BFB8;--navActive:#1D3328;--navActiveInk:#8EE0B6;
  --accent:#35B57E;--accentInk:#0B130F;--accentSoft:#1B3026;--accentDeep:#8EE0B6;
  --red:#F2A197;--redSoft:#3A1F1C;--amber:#F0C06A;--amberSoft:#382A12;--graySoft:#232A26;--blue:#8DB8EE;--blueSoft:#1C2A3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#111513;--surface:#191E1B;--surface2:#1E2420;--line:#2B332E;--line2:#232A26;
  --ink:#ECF1ED;--muted:#A3ADA6;--nav:#151A17;--navInk:#B6BFB8;--navActive:#1D3328;--navActiveInk:#8EE0B6;
  --accent:#35B57E;--accentInk:#0B130F;--accentSoft:#1B3026;--accentDeep:#8EE0B6;
  --red:#F2A197;--redSoft:#3A1F1C;--amber:#F0C06A;--amberSoft:#382A12;--graySoft:#232A26;--blue:#8DB8EE;--blueSoft:#1C2A3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.app{display:flex;height:100%}
nav.side{width:248px;flex-shrink:0;background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:2px;overflow-y:auto}
nav.side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:2px 8px 16px;color:var(--ink)}
nav.side .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center}
nav.side .grp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
nav.side button{all:unset;box-sizing:border-box;cursor:pointer;color:var(--navInk);padding:9px 10px;border-radius:10px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;width:100%}
nav.side button svg{flex-shrink:0;opacity:.85}
nav.side button:hover{background:var(--graySoft);color:var(--ink)}
nav.side button.on{background:var(--navActive);color:var(--navActiveInk);font-weight:700}
nav.side button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.side .lbl{flex:1}
.badge{background:#D93025;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;line-height:17px}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.top .subtitle{font-size:13px;color:var(--muted);margin-top:2px}
.top .ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 3px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.who select{border:0;background:transparent;height:30px;padding:0 6px;font-weight:600;max-width:260px}
.content{flex:1;overflow:auto;padding:24px 28px 72px}
select,input,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:42px;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
textarea{height:76px;padding:10px 12px;width:100%}
input.num{width:104px;text-align:right;font-variant-numeric:tabular-nums}
.btn{font-family:inherit;font-size:14px;font-weight:600;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:#B9C0B8;background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentInk);box-shadow:0 1px 2px rgba(23,134,90,.25)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--red);border-color:var(--red);background:var(--surface)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:15px;font-weight:700}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{display:flex;flex-direction:column;gap:4px;position:relative;cursor:default}
.kpi.link{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi.link:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(24,32,28,.09)}
.kpi .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td,table tr:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px 4px 8px;border-radius:999px;background:var(--graySoft);color:var(--muted);white-space:nowrap;text-transform:capitalize}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.g{background:var(--accentSoft);color:var(--accentDeep)}
.pill.r{background:var(--redSoft);color:var(--red)}
.pill.a{background:var(--amberSoft);color:var(--amber)}
.alert{padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.alert.r{background:var(--redSoft);color:var(--red)}.alert.a{background:var(--amberSoft);color:var(--amber)}.alert.n{background:var(--graySoft)}.alert.g{background:var(--accentSoft);color:var(--accentDeep)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.bar{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--accent),#3FB37F)}
.sec{margin:26px 0 12px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.modalbg{position:fixed;inset:0;background:rgba(17,23,20,.45);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;z-index:50;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:20px;width:min(940px,100%);box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pop .18s ease;display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal header h3{margin:0;font-size:18px;font-weight:800}
.modal .body{padding:18px 22px;overflow:auto;flex:1}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--surface2);border-radius:0 0 20px 20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px 12px 14px;border-radius:14px;font-weight:600;z-index:60;max-width:92vw;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s ease}
.toast::before{content:"✓";width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.toast.err{background:#B3261E;color:#fff}.toast.err::before{content:"!";background:rgba(255,255,255,.25)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.menu{display:none}
.helpbox{background:var(--blueSoft);color:var(--blue);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:13.5px;line-height:1.55}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello{font-size:15px;color:var(--muted);margin-bottom:16px}
.hello strong{color:var(--ink)}
.backdrop{display:none}
.empty{text-align:center;padding:40px 20px}
@media (max-width:860px){
  .ie-grid{grid-template-columns:1fr!important}
  nav.side{position:fixed;left:0;top:0;bottom:0;z-index:41;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  nav.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .hide-sm{display:none}
  .top .ctx{width:100%}
  .who{flex:1 1 100%;min-width:0}
  #locSel{flex:1}
  .who select{max-width:none;width:100%}
  #sync{display:none}
  .backdrop.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .menu{display:inline-flex}
  .content{padding:16px 14px 72px}.top{padding:10px 14px}
  .two{grid-template-columns:1fr}
  .who select{max-width:170px}
  .top .subtitle{display:none}
}
#notifPanel{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:16px;width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 96px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 56px rgba(0,0,0,.22);z-index:45;display:flex;flex-direction:column;overflow:hidden;animation:pop .16s ease}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing{background:#fff}#printArea{display:block}#printArea .invdoc{border:0!important;padding:0!important}#printArea th,#printArea td{padding:8px 10px;border-bottom:1px solid #ddd}}
#printArea{display:none}
.invdoc tr:hover td{background:transparent}.invdoc .r{text-align:right}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Main"></nav><div class="backdrop" id="backdrop"></div>
  <main>
    <div class="top">
      <div class="row" style="flex-wrap:nowrap"><button class="btn menu" id="menuBtn" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button><div><h1 id="title">Dashboard</h1><div class="subtitle" id="subtitle"></div></div></div>
      <div class="ctx">
        <label class="who" title="Switch test user"><span class="avatar" id="avatar">O</span><select id="userSel" aria-label="Signed in as (switch test user)"></select></label>
        <select id="locSel" aria-label="Location filter"></select>
        <span class="sync" id="sync">Local only</span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script>
'use strict';
/* ============ Utilities ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n * 1000) / 1000;
const qf = n => (Math.round(n * 100) / 100).toLocaleString('en-US', {maximumFractionDigits: 2});
const tk = n => '৳' + Math.round(n).toLocaleString('en-US');
const pad = (n, w = 6) => String(n).padStart(w, '0');
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const daysTo = s => Math.round((new Date(s + 'T00:00:00') - new Date(TODAY + 'T00:00:00')) / 86400000);
const nice = s => s ? new Date(s + (s.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const niceT = s => new Date(s).toLocaleString('en-GB', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const TODAY = iso(new Date());
const EPS = 1e-6;

/* ============ Roles & permissions ============ */
const ROLES = {
  owner:   {label:'Owner (Super Admin)', viewAll:true, perms:'*', desc:'Full access to everything, including finance, approvals and inviting users.'},
  admin:   {label:'Admin', viewAll:true, perms:['cost','master','po.create','po.approve','receive','tr.request','tr.dispatch','tr.receive','waste','waste.approve','count','count.approve','adj','adj.approve','consume','lot.manage','audit'], desc:'Runs day-to-day operations and setup. Cannot invite users or approve restock/distribution (Owner only).'},
  viewer:  {label:'Viewer', viewAll:true, perms:['cost'], desc:'Read-only. Can see all stock, values and reports, but cannot change anything.'},
  invmgr:  {label:'Inventory Manager', viewAll:true, perms:['cost','master','po.create','po.approve','receive','tr.request','tr.dispatch','tr.receive','waste','waste.approve','count','count.approve','adj','adj.approve','consume','lot.manage','audit']},
  brmgr:   {label:'Branch Manager', viewAll:true, perms:['cost','tr.request','tr.receive','waste','count','adj','consume']},
  store:   {label:'Storekeeper', perms:['receive','tr.dispatch','tr.receive','count']},
  kitchen: {label:'Kitchen Manager', perms:['consume','waste']},
  auditor: {label:'Auditor', viewAll:true, perms:['cost','audit']}
};
const LIMITS = {waste: 2000, adj: 3000, po: 50000};

/* ============ Seed data ============ */
function seed(mode = 'zero') {
  const st = {v:2, dists:[], grns:[], rev:0, seq:{}, locations:[], users:[], items:[], suppliers:[], lots:[], txns:[], pos:[], transfers:[], waste:[], adjs:[], counts:[], audit:[], discrepancies:[]};
  st.locations = [
    {id:'C', name:'Central Warehouse', brand:'Central', type:'central'},
    {id:'A1', name:'Dhanmondi', brand:'Brand A', type:'branch'},
    {id:'A2', name:'Gulshan', brand:'Brand A', type:'branch'},
    {id:'A3', name:'Uttara', brand:'Brand A', type:'branch'},
    {id:'B1', name:'Banani', brand:'Brand B', type:'branch'},
    {id:'B2', name:'Mirpur', brand:'Brand B', type:'branch'}
  ];
  st.users = [
    {id:'u1', name:'Owner', role:'owner', locs:'all'},
    {id:'u2', name:'Nadia', role:'invmgr', locs:'all'},
    {id:'u3', name:'Karim', role:'store', locs:['C']},
    {id:'u4', name:'Rahim', role:'brmgr', locs:['A1']},
    {id:'u5', name:'Tania', role:'brmgr', locs:['A2']},
    {id:'u6', name:'Jamal', role:'kitchen', locs:['B1']},
    {id:'u7', name:'Auditor', role:'auditor', locs:'all'}
  ];
  const I = (id,name,unit,cat,policy,expiry,cost,shelf,par,parC,sup) => ({id,name,unit,cat,policy,expiry,cost,shelf,par,parC,sup,pars:{},active:true});
  st.items = [
    I('CHB','Chicken Breast','kg','Meat','FEFO',true,520,7,40,200,'S1'),
    I('CHT','Chicken Thigh','kg','Meat','FEFO',true,430,7,25,120,'S1'),
    I('BUN','Burger Bun','pc','Bakery','FEFO',true,18,4,200,800,'S2'),
    I('CHD','Cheddar Slices','pack','Dairy','FEFO',true,650,30,8,40,'S3'),
    I('MLK','Milk','L','Dairy','FEFO',true,95,5,20,80,'S3'),
    I('LET','Lettuce','kg','Produce','FEFO',true,160,4,6,25,'S4'),
    I('TOM','Tomato','kg','Produce','FEFO',true,90,6,8,30,'S4'),
    I('SAU','Burger Sauce','kg','Dry goods','FIFO',true,480,60,5,25,'S5'),
    I('OIL','Frying Oil','L','Dry goods','FIFO',false,190,0,20,100,'S5'),
    I('NAP','Napkins','pc','Packaging','FIFO',false,1.2,0,1000,5000,'S5')
  ];
  st.suppliers = [
    {id:'S1', name:'Fresh Farms Poultry'}, {id:'S2', name:'Dhaka Bakery'}, {id:'S3', name:'Dairy Co'},
    {id:'S4', name:'Green Valley Produce'}, {id:'S5', name:'Metro Wholesale'}
  ];
  D = st; CUR = st.users[0];
  if (mode === 'blank') { st.items = []; st.suppliers = []; }
  if (mode === 'demo') {
  // Opening balances through the engine
  D = st; CUR = st.users[0];
  st.locations.forEach((l, li) => {
    st.items.forEach((it, ii) => {
      const par = l.type === 'central' ? it.parC : it.par;
      const f = [0.9, 0.55, 0.35, 0.7, 0.45, 0.8][(li + ii) % 6];
      const total = Math.max(1, Math.round(par * f * 1.1));
      const older = Math.round(total * 0.4), newer = total - older;
      const exp1 = it.expiry ? addDays(TODAY, Math.max(1, Math.round(it.shelf * 0.3))) : null;
      const exp2 = it.expiry ? addDays(TODAY, it.shelf) : null;
      if (older > 0) receiveIn({type:'OPENING', item:it.id, loc:l.id, qty:older, cost:it.cost * 0.97, exp:exp1, recv:addDays(TODAY, -3), ref:'Opening balance'});
      receiveIn({type:'OPENING', item:it.id, loc:l.id, qty:newer, cost:it.cost, exp:exp2, recv:addDays(TODAY, -1), ref:'Opening balance'});
    });
  });
  // Scenario lots for testing alerts
  receiveIn({type:'OPENING', item:'MLK', loc:'B1', qty:12, cost:92, exp:addDays(TODAY,-1), recv:addDays(TODAY,-6), ref:'Opening balance'});
  receiveIn({type:'OPENING', item:'CHB', loc:'C', qty:35, cost:505, exp:addDays(TODAY,2), recv:addDays(TODAY,-5), ref:'Opening balance'});
  }
  st.lists = defaultLists(st); st.fields = [];
  st.audit = [];
  st.seq.AUD = 0;
  if (mode !== 'demo') { st.txns = []; st.lots = []; st.seq = {}; }
  st.seq.AUD = 0;
  audit('System', mode === 'demo' ? 'Demo data created' : 'Fresh start', mode === 'demo' ? 'Opening balances loaded' : (mode === 'blank' ? 'Empty system: no products, suppliers or stock' : 'All stock and figures at zero; products and suppliers kept'));
  return st;
}

/* ============ State, persistence ============ */
let S = null;        // committed state
let D = null;        // draft during an action
let CUR = null;      // current user
let VIEW = 'dashboard';
let LOC = 'all';
let db = null, docRef = null, writing = false, pending = false;

function loadLocal() { try { const t = localStorage.getItem('stockline_state'); return t ? JSON.parse(t) : null; } catch (e) { return null; } }

async function persist() {

  writing = true; setSync('Saving…');

    await docRef.set({json: body, rev: S.rev});

}
function setSync(t) { const el = $('#sync'); if (el) el.textContent = t; }

async function connectDb() {
  try {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use('db');
    if (!db) return;
    docRef = db.doc('app/state');
    const snap = await docRef.get();
    if (snap.exists) {
      const d = snap.data();
      const remote = migrate(JSON.parse(d.json)); if (!remote) return;
      if (!S || (remote.rev || 0) >= (S.rev || 0)) { S = remote; fixUser(); render(); }
      else persist();
    } else { persist(); }
    setSync('Saved · shared');
    docRef.onSnapshot(s => {
      if (!s.exists || writing) return;
      const d = s.data(); if (!d || !d.json) return;
      if ((d.rev || 0) > (S.rev || 0)) { S = migrate(JSON.parse(d.json)) || S; fixUser(); render(); setSync('Updated from another user'); }
    }, () => setSync('Offline — local copy'));
  } catch (e) { setSync('Local only'); }
}

/* Every mutation runs on a draft copy; on error nothing is committed (atomic). */
function act(fn, okMsg) {
  D = JSON.parse(JSON.stringify(S));

    fn(D);
    D.rev = (D.rev || 0) + 1;
    S = D; D = null;
    persist(); render();
    if (okMsg) toast(okMsg);

}

/* ============ INVENTORY ENGINE ============ */
function lotStatus(l) {
  if (l.status === 'disposed') return 'disposed';
  if (l.rem <= EPS) return 'depleted';
  if (l.status === 'quarantined') return 'quarantined';
  if (l.exp) { const d = daysTo(l.exp); if (d < 0) return 'expired'; if (d <= 3) return 'near'; }
  return 'available';
}
function lotsOf(itemId, locId) { return st().lots.filter(l => l.item === itemId && l.loc === locId); }

function sortForUse(it, lots) {

      if (ea !== eb) return ea < eb ? -1 : 1;
    }
    if (a.recv !== b.recv) return a.recv < b.recv ? -1 : 1;
    return a.n - b.n;

}
/* Allocate qty against the oldest eligible lots (FEFO/FIFO). Expired & quarantined lots are never eligible. */
function allocate(itemId, locId, qty, {preview = false} = {}) {
  const it = item(itemId);
  const lots = sortForUse(it, lotsOf(itemId, locId).filter(l => ['available','near'].includes(lotStatus(l))));
  const avail = r2(lots.reduce((a, l) => a + l.rem, 0));
  if (avail + EPS < qty) {
    const blocked = r2(lotsOf(itemId, locId).filter(l => ['expired','quarantined'].includes(lotStatus(l))).reduce((a, l) => a + l.rem, 0));
    throw new Error('Not enough ' + it.name + ' at ' + locName(locId) + ': usable ' + qf(avail) + ' ' + it.unit + ', needed ' + qf(qty) + (blocked ? ' (' + qf(blocked) + ' ' + it.unit + ' is expired/quarantined and cannot be used)' : '') + '.');
  }
  let left = qty; const out = [];
  for (const l of lots) {
    if (left <= EPS) break;
    const take = r2(Math.min(l.rem, left));
    if (!preview) l.rem = r2(l.rem - take);
    out.push({lot: l.id, code: l.code, qty: take, cost: l.cost, exp: l.exp, recv: l.recv});
    left = r2(left - take);
  }
  return out;
}
function postTxn({type, itemId, locId, qty, alloc, value, ref, reason}) {
  const t = {id: 't' + next('TXN'), no: 'TXN-' + pad(D.seq.TXN), type, item: itemId, loc: locId, qty: r2(qty), value: r2(value), at: new Date().toISOString(), user: CUR.id, ref: ref || '', reason: reason || '', alloc: alloc || []};

}
/* Inbound: creates a new lot + transaction. recv date is the FIFO key and is preserved across transfers. */
function receiveIn({type, item: itemId, loc: locId, qty, cost, exp, recv, ref, reason, origin}) {
  if (qty <= EPS) return null;
  const n = next('LOT');
  const lot = {id: 'l' + n, n, code: itemId + '-' + pad(n, 4), item: itemId, loc: locId, recv: recv || TODAY, exp: exp || null, cost: r2(cost), orig: r2(qty), rem: r2(qty), status: 'active', origin: origin || null, src: ref || ''};
  D.lots.push(lot);
  postTxn({type, itemId, locId, qty, alloc: [{lot: lot.id, code: lot.code, qty, cost: lot.cost}], value: qty * cost, ref, reason});

}
/* Outbound: FEFO/FIFO allocation + transaction. */
function issueOut({type, item: itemId, loc: locId, qty, ref, reason}) {

  const value = alloc.reduce((a, x) => a + x.qty * x.cost, 0);

  return {alloc, value, txn: t};

/* Integrity: ledger sum must equal lot balances for every item/location. */
function integrity() {
  const s = S, bad = [];
  const led = {};
  s.txns.forEach(t => { const k = t.item + '|' + t.loc; led[k] = (led[k] || 0) + t.qty; });
  s.items.forEach(it => s.locations.forEach(l => {
    const k = it.id + '|' + l.id;
    const lots = r2(s.lots.filter(x => x.item === it.id && x.loc === l.id && x.status !== 'disposed').reduce((a, x) => a + x.rem, 0));

}

function migrate(s) {

function noData(t) { return '<div class="muted" style="height:170px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--surface2);border-radius:12px;padding:12px">' + esc(t) + '</div>'; }
/* Grouped columns over time */
function svgColumns(labels, series, fmt) {
  const W = 640, H = 220, pl = 44, pb = 26, pt = 10, pr = 8;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const cw = (W - pl - pr) / labels.length, bw = Math.max(2, Math.min(14, (cw - 6) / series.length));
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = pt + (H - pt - pb) * (1 - i / 4); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--line2)"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end" style="fill:var(--muted);font-size:10px">' + shortN(max * i / 4) + '</text>'; }
  labels.forEach((l, i) => {
    const x0 = pl + cw * i + (cw - bw * series.length) / 2;
    series.forEach((s, j) => { const v = s.values[i], hh = (H - pt - pb) * v / max; if (v > 0) g += '<rect x="' + (x0 + j * bw) + '" y="' + (H - pb - hh) + '" width="' + (bw - 1) + '" height="' + hh + '" rx="2" style="fill:' + s.color + '"><title>' + esc(l) + ' · ' + esc(s.name) + ': ' + fmt(v) + '</title></rect>'; });
    const step = labels.length <= 8 ? 1 : labels.length <= 16 ? 2 : 5; if (i % step === 0 || i === labels.length - 1) g += '<text x="' + (pl + cw * i + cw / 2) + '" y="' + (H - 8) + '" text-anchor="middle" style="fill:var(--muted);font-size:10px">' + esc(l) + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="Column chart">' + g + '</svg>' + legend(series.map(s => [s.name, s.color]));
}
function svgDonut(data, fmt, centerLabel) {
  const tot = data.reduce((a, d) => a + d.value, 0); if (tot <= 0) return noData('No stock yet.');
  const R = 70, r = 44, cx = 90, cy = 90; let a0 = -Math.PI / 2, g = '';
  data.forEach((d, i) => { const a1 = a0 + 2 * Math.PI * d.value / tot; const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (A, rad) => (cx + rad * Math.cos(A)).toFixed(2) + ' ' + (cy + rad * Math.sin(A)).toFixed(2);
    const path = data.length === 1 ? 'M ' + (cx - R) + ' ' + cy + ' a ' + R + ' ' + R + ' 0 1 0 ' + 2 * R + ' 0 a ' + R + ' ' + R + ' 0 1 0 ' + (-2 * R) + ' 0 M ' + (cx - r) + ' ' + cy + ' a ' + r + ' ' + r + ' 0 1 1 ' + 2 * r + ' 0 a ' + r + ' ' + r + ' 0 1 1 ' + (-2 * r) + ' 0' :
      'M ' + p(a0, R) + ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(a1, R) + ' L ' + p(a1, r) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p(a0, r) + ' Z';
    g += '<path d="' + path + '" fill-rule="evenodd" style="fill:' + PALETTE[i % PALETTE.length] + ';stroke:var(--surface);stroke-width:2"><title>' + esc(d.label) + ': ' + fmt(d.value) + ' (' + Math.round(d.value / tot * 100) + '%)</title></path>'; a0 = a1; });
  g += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" style="fill:var(--ink);font-size:15px;font-weight:800">' + fmt(tot) + '</text><text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" style="fill:var(--muted);font-size:10px">' + esc(centerLabel) + '</text>';
  return '<div class="row" style="flex-wrap:nowrap;gap:18px;align-items:center"><svg viewBox="0 0 180 180" style="width:170px;flex-shrink:0" role="img" aria-label="Donut chart">' + g + '</svg><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:13px">' +
    data.map((d, i) => '<div class="row between" style="flex-wrap:nowrap"><span class="row" style="gap:7px;flex-wrap:nowrap;min-width:0"><span style="width:10px;height:10px;border-radius:3px;flex-shrink:0;background:' + PALETTE[i % PALETTE.length] + '"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(d.label) + '</span></span><span class="mono muted">' + Math.round(d.value / tot * 100) + '%</span></div>').join('') + '</div></div>';
}
function hBars(data, fmt, color) {
  if (!data.length) return noData('Nothing recorded in this period.');
  const max = Math.max(1, ...data.map(d => d.value));
  return '<div style="display:flex;flex-direction:column;gap:10px">' + data.map((d, i) => '<div><div class="row between" style="font-size:13px;margin-bottom:4px"><span>' + esc(d.label) + '</span><span class="mono" style="font-weight:700">' + fmt(d.value) + '</span></div><div style="height:9px;background:var(--graySoft);border-radius:999px;overflow:hidden"><div title="' + esc(d.label + ': ' + fmt(d.value)) + '" style="height:100%;width:' + Math.max(2, d.value / max * 100) + '%;background:' + (d.color || color || PALETTE[i % PALETTE.length]) + ';border-radius:999px"></div></div></div>').join('') + '</div>';
}
function dashCharts(L) {

  const days = []; for (let i = CHART_DAYS - 1; i >= 0; i--) days.push(addDays(TODAY, -i));
  const dayLbl = s => new Date(s + 'T00:00:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});
  const tx = S.txns.filter(t => L.includes(t.loc) && t.at.slice(0, 10) >= days[0]);
  const sum = (types, d) => tx.filter(t => types.includes(t.type) && iso(t.at) === d).reduce((a, t) => a + (val ? Math.abs(t.value) : Math.abs(t.qty)), 0);
  const series = [
    {name: 'Bought from vendors', color: 'var(--accent)', values: days.map(d => sum(['PURCHASE_RECEIPT'], d))},
    {name: 'Sent to branches', color: 'var(--blue)', values: days.map(d => sum(['TRANSFER_OUT'], d))},
    {name: 'Used in kitchen', color: 'var(--amber)', values: days.map(d => sum(['CONSUMPTION'], d))},
    {name: 'Wasted', color: 'var(--red)', values: days.map(d => sum(['WASTE','EXPIRED_WRITE_OFF'], d))}
  ];
  const hasMove = series.some(s => s.values.some(v => v > 0));
  const periodSel = '<div class="row" style="gap:4px">' + [7, 14, 30].map(n => '<button class="btn sm' + (CHART_DAYS === n ? ' pri' : '') + '" data-chartdays="' + n + '">' + n + 'd</button>').join('') + '</div>';
  const c1 = chartCard('Stock movement', (val ? 'Value (৳)' : 'Quantity') + ' per day, last ' + CHART_DAYS + ' days', hasMove ? svgColumns(days.map(dayLbl), series, fmt) : noData('No movements yet in this period. Buy from a vendor and distribute to see activity here.'), periodSel);
  // category mix
  const cat = {}; S.lots.filter(l => L.includes(l.loc) && l.rem > EPS && l.status !== 'disposed').forEach(l => { const c = (item(l.item) || {}).cat || 'Other'; cat[c] = (cat[c] || 0) + (val ? l.rem * l.cost : l.rem); });
  let catD = Object.entries(cat).map(([label, value]) => ({label, value})).sort((a, b) => b.value - a.value);
  if (catD.length > 7) { const rest = catD.slice(6).reduce((a, d) => a + d.value, 0); catD = catD.slice(0, 6).concat([{label: 'Other', value: rest}]); }
  const c2 = chartCard('Stock by category', val ? 'Share of stock value' : 'Share of stock quantity' + unitsNote, svgDonut(catD, v => val ? tk(v) : shortN(v), val ? 'stock value' : 'units'));
  // location
  const locD = L.map(l => ({label: locName(l), value: S.lots.filter(x => x.loc === l && x.rem > EPS && x.status !== 'disposed').reduce((a, x) => a + (val ? x.rem * x.cost : x.rem), 0), color: loc(l).type === 'central' ? 'var(--accent)' : 'var(--blue)'})).sort((a, b) => b.value - a.value);
  const c3 = chartCard('Stock by location', val ? 'Stock value held at each location' : 'Stock quantity held at each location' + unitsNote, locD.some(d => d.value > 0) ? hBars(locD, fmt) : noData('No stock yet.'));
  // expiry next 7 days
  const exDays = []; for (let i = 0; i <= 6; i++) exDays.push(addDays(TODAY, i));
  const lotsL = S.lots.filter(l => L.includes(l.loc) && l.rem > EPS && l.status !== 'disposed' && l.exp);
  const expired = lotsL.filter(l => l.exp < TODAY).reduce((a, l) => a + (val ? l.rem * l.cost : l.rem), 0);
  const exVals = exDays.map(d => lotsL.filter(l => l.exp === d).reduce((a, l) => a + (val ? l.rem * l.cost : l.rem), 0));
  const exLabels = ['Expired'].concat(exDays.map((d, i) => i === 0 ? 'Today' : i === 1 ? 'Tmrw' : new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {weekday: 'short'})));
  const c4 = chartCard('Expiring soon', 'What expires over the next 7 days — use or distribute it first', (expired + exVals.reduce((a, b) => a + b, 0)) > 0 ? svgColumns(exLabels, [{name: val ? 'Stock value expiring' : 'Quantity expiring', color: 'var(--amber)', values: [expired].concat(exVals)}], fmt) : noData('Nothing expires in the next 7 days.'));
  // waste by reason (period)
  const w = {}; S.txns.filter(t => t.type === 'WASTE' && L.includes(t.loc) && t.at.slice(0, 10) >= days[0]).forEach(t => { const k = t.reason || 'Other'; w[k] = (w[k] || 0) + (val ? Math.abs(t.value) : Math.abs(t.qty)); });
  S.txns.filter(t => t.type === 'EXPIRED_WRITE_OFF' && L.includes(t.loc) && t.at.slice(0, 10) >= days[0]).forEach(t => w['Expired (written off)'] = (w['Expired (written off)'] || 0) + (val ? t.value : Math.abs(t.qty)));
  const c5 = chartCard('Waste by reason', 'Last ' + CHART_DAYS + ' days', hBars(Object.entries(w).map(([label, value]) => ({label, value})).sort((a, b) => b.value - a.value).slice(0, 6), fmt, 'var(--red)'));
  // stock vs target heatmap
  const B = L.filter(l => loc(l).type === 'branch'); const its = AI();
  let heat = '';
  if (B.length && its.length) {
    const cell = pct => { const c = pct >= 1 ? 'var(--accentSoft)' : pct >= .5 ? 'var(--amberSoft)' : 'var(--redSoft)'; const t = pct >= 1 ? 'var(--accentDeep)' : pct >= .5 ? 'var(--amber)' : 'var(--red)'; return 'background:' + c + ';color:' + t; };
    heat = '<div class="tbl" style="box-shadow:none"><table style="min-width:' + (180 + B.length * 92) + 'px"><tr><th>Product</th>' + B.map(b => '<th class="r">' + esc(locName(b)) + '</th>').join('') + '</tr>' +
      its.map(it => '<tr><td style="white-space:nowrap">' + esc(it.name) + '</td>' + B.map(b => { const par = parOf(it, b), oh = onHand(it.id, b), pct = par > 0 ? oh / par : 1; return '<td class="r mono" style="font-weight:700;' + cell(pct) + '" title="' + esc(it.name + ' at ' + locName(b) + ': ' + qf(oh) + ' of ' + par + ' ' + it.unit) + '">' + (par > 0 ? Math.round(pct * 100) + '%' : '—') + '</td>'; }).join('') + '</tr>').join('') + '</table></div>' +
      legend([['At or above target', 'var(--accentSoft)'], ['50–99% of target', 'var(--amberSoft)'], ['Below half — restock', 'var(--redSoft)']]);
  }

  const prod = AI().map(it => { const ls = S.lots.filter(l => l.item === it.id && L.includes(l.loc) && l.rem > EPS && l.status !== 'disposed'); return {it, qty: r2(ls.reduce((a, l) => a + l.rem, 0)), value: ls.reduce((a, l) => a + l.rem * l.cost, 0)}; }).filter(x => x.qty > 0).sort((a, b) => val ? b.value - a.value : b.qty - a.qty);
  const totV = prod.reduce((a, y) => a + y.value, 0) || 1;
  const prodBody = prod.length ? '<div class="tbl" style="box-shadow:none"><table style="min-width:420px"><tr><th>Product</th><th class="r">Quantity</th>' + (showCost() ? '<th class="r">Value</th><th class="r">Share of value</th>' : '') + '<th style="width:36%"></th></tr>' +
    prod.slice(0, 12).map(x => { const maxv = val ? prod[0].value : prod[0].qty; const w = Math.max(2, (val ? x.value : x.qty) / (maxv || 1) * 100);
      return '<tr><td>' + esc(x.it.name) + '</td><td class="r mono" style="font-weight:700">' + qf(x.qty) + ' <span class="muted" style="font-weight:500">' + esc(x.it.unit) + '</span></td>' + (showCost() ? '<td class="r mono">' + tk(x.value) + '</td><td class="r mono muted">' + Math.round(x.value / totV * 100) + '%</td>' : '') + '<td><div style="height:9px;background:var(--graySoft);border-radius:999px"><div style="height:100%;width:' + w + '%;background:' + (val ? 'var(--accent)' : 'var(--blue)') + ';border-radius:999px"></div></div></td></tr>'; }).join('') + '</table></div>' + (prod.length > 12 ? '<div class="muted" style="margin-top:8px;font-size:12.5px">Showing top 12 of ' + prod.length + ' products · <a href="#" data-kpi="inventory">see all in Inventory</a></div>' : '') : noData('No stock yet.');
  const c7 = chartCard('Stock by product', (val ? 'Ranked by value' : 'Ranked by quantity') + ' — each product in its own unit', prodBody);
  const modeSel = showCost() ? '<div class="row" style="gap:4px" role="group" aria-label="Show charts by"><button class="btn sm' + (val ? ' pri' : '') + '" data-chartmode="value" aria-pressed="' + val + '">By value (৳)</button><button class="btn sm' + (!val ? ' pri' : '') + '" data-chartmode="qty" aria-pressed="' + !val + '">By quantity</button></div>' : '<span class="muted" style="font-size:13px">Showing quantities</span>';

    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin-top:16px">' + c2 + c3 + c5 + '</div>' +

const KPI_META = {

function kpi(l, v, s, color) {

}

function receivePO(id) {

  openModal('Receive ' + p.no + ' — ' + S.suppliers.find(s => s.id === p.sup).name,

    open.map((l, i) => { const it = item(l.item); const out = r2(l.qty - l.rcv - l.rej);
      return '<tr><td>' + esc(it.name) + ' <span class="muted">' + it.unit + '</span><div class="muted" style="font-size:12px">PO price ' + money(l.price) + '</div></td><td class="r mono">' + qf(out) + '</td><td class="r"><input class="num" type="number" min="0" step="any" data-acc="' + l.item + '" value="' + out + '"></td><td class="r"><input class="num" type="number" min="0" step="any" data-rej="' + l.item + '" value="0"></td><td>' + (it.expiry ? '<input type="date" data-exp="' + l.item + '" value="' + addDays(TODAY, it.shelf) + '" aria-label="Expiry for ' + esc(it.name) + '">' : '<span class="muted">not tracked</span>') + '</td><td class="r"><input class="num" type="number" min="0" step="any" data-prc="' + l.item + '" value="' + l.price + '"></td></tr>'; }).join('') +
    '</table></div><div class="muted" style="margin-top:8px">Rejected quantity never enters stock. A price more than 5% above the PO is flagged to management. Receiving less than outstanding leaves the PO partially received.</div>',
    {submit: 'Confirm receipt', onSubmit: () => {
      const inv = $('#grnInv').value.trim(), date = $('#grnDate').value;
      const rows = open.map(l => ({l, acc: +(document.querySelector('[data-acc="' + l.item + '"]').value || 0), rej: +(document.querySelector('[data-rej="' + l.item + '"]').value || 0), exp: (document.querySelector('[data-exp="' + l.item + '"]') || {}).value || null, prc: +document.querySelector('[data-prc="' + l.item + '"]').value}));
      return act(d => {
        need('receive'); needLoc(p.loc);
        const po = d.pos.find(x => x.id === id);
        if (!['approved','partial'].includes(po.status)) throw new Error('This PO is not open for receiving.');
        if (!inv) throw new Error('Supplier invoice number is required.');
        d.grns = d.grns || [];
        if (d.grns.some(g => g.sup === po.sup && g.invoice.toLowerCase() === inv.toLowerCase())) throw new Error('Invoice ' + inv + ' from this supplier was already received (duplicate receiving blocked).');
        if (!rows.some(r => r.acc > 0 || r.rej > 0)) throw new Error('Enter at least one accepted or rejected quantity.');
        const n = next('GRN'); const gno = 'GRN-' + pad(n); const lotsMade = []; let value = 0; const flags = [];
        rows.forEach(r => {
          const line = po.lines.find(x => x.item === r.l.item); const it = item(line.item);
          const out = r2(line.qty - line.rcv - line.rej);
          if (r.acc < 0 || r.rej < 0) throw new Error('Quantities cannot be negative.');
          if (r2(r.acc + r.rej) > out * 1.05 + EPS) throw new Error(it.name + ': accepted + rejected (' + qf(r.acc + r.rej) + ') exceeds outstanding ' + qf(out) + ' by more than 5% tolerance.');
          if (r.acc > 0) {
            if (it.expiry && !r.exp) throw new Error(it.name + ': expiry date is required.');

            if (!(r.prc > 0)) throw new Error(it.name + ': price must be above zero.');
            const lot = receiveIn({type: 'PURCHASE_RECEIPT', item: it.id, loc: po.loc, qty: r.acc, cost: r.prc, exp: it.expiry ? r.exp : null, recv: date, ref: gno + ' / ' + po.no});
            lotsMade.push(lot.code); value += r.acc * r.prc;
            if (r.prc > line.price * 1.05) flags.push(it.name + ' +' + Math.round((r.prc / line.price - 1) * 100) + '%');
            const master = d.items.find(x => x.id === it.id); master.prevCost = master.cost; master.cost = r.prc;
          }
          line.rcv = r2(line.rcv + r.acc); line.rej = r2(line.rej + r.rej);
        });
        const done = po.lines.every(x => r2(x.qty - x.rcv - x.rej) <= EPS);
        po.status = done ? 'received' : 'partial';
        d.grns.push({id: 'g' + n, no: gno, po: po.no, sup: po.sup, invoice: inv, loc: po.loc, at: new Date().toISOString(), by: CUR.id, value: r2(value), lots: lotsMade});

        if (flags.length) audit('Price increase flagged', gno, flags.join(', '));
      }, 'Receipt confirmed — batches created');
    }});
}

    {submit: 'Approve', onSubmit: () => {

        audit('Transfer approved', x.no, x.lines.map(l => item(l.item).name + ' ' + qf(l.appr)).join(', '));

}
function dispatchTransfer(id) {
  const t = S.transfers.find(x => x.id === id);
  openModal('Dispatch ' + t.no + ' → ' + locName(t.to),
    '<div class="row" style="margin-bottom:10px">' + needBy(t, true) + '</div>' + '<div class="muted" style="margin-bottom:8px">The system picks lots by earliest expiry (FEFO) or oldest receipt (FIFO). Pull these lots physically.</div>' +
    '<div class="tbl"><table><tr><th>Item</th><th class="r">Approved</th><th class="r">Usable</th><th>Lots to pick</th><th class="r">Dispatch qty</th></tr>' +
    t.lines.map(l => { const it = item(l.item); const av = usable(l.item, t.from); const q = Math.min(l.appr, av); let prev = '';
      try { prev = allocate(l.item, t.from, q, {preview: true}).map(a => a.code + ' · ' + qf(a.qty) + (a.exp ? ' (exp ' + nice(a.exp) + ')' : '')).join('<br>'); } catch (e) { prev = '—'; }
      return '<tr><td>' + esc(it.name) + ' <span class="muted">' + it.unit + '</span></td><td class="r mono">' + qf(l.appr) + '</td><td class="r mono">' + qf(av) + '</td><td class="mono" style="font-size:12px">' + prev + '</td><td class="r"><input class="num" type="number" min="0" step="any" data-dq="' + l.item + '" value="' + r2(q) + '"></td></tr>'; }).join('') + '</table></div>',
    {submit: 'Dispatch', onSubmit: () => {
      const vals = {}; document.querySelectorAll('[data-dq]').forEach(i => vals[i.dataset.dq] = +i.value || 0);
      return act(d => { need('tr.dispatch'); const x = d.transfers.find(y => y.id === id); needLoc(x.from);
        if (x.status !== 'approved') throw new Error('Transfer is not ready to dispatch.');
        let any = false;
        x.lines.forEach(l => { const q = vals[l.item]; if (q > l.appr + EPS) throw new Error(item(l.item).name + ': cannot dispatch more than approved.');
          if (q > 0) { const r = issueOut({type: 'TRANSFER_OUT', item: l.item, loc: x.from, qty: q, ref: x.no + ' → ' + locName(x.to)}); l.disp = q; l.alloc = r.alloc; any = true; } });
        if (!any) throw new Error('Dispatch at least one item.');
        x.lines = x.lines.filter(l => l.disp > 0);
        x.status = 'in_transit'; x.dispBy = CUR.id; x.dispAt = new Date().toISOString();
        const inv = issueInvoice(d, x); audit(inv.updated ? 'Invoice finalised' : 'Invoice issued', inv.no, x.no + ' → ' + locName(x.to) + ' · ' + tk(inv.total));
        audit('Transfer dispatched', x.no, x.lines.map(l => item(l.item).name + ' ' + qf(l.disp) + ' [' + l.alloc.map(a => a.code).join('+') + ']').join(', '));
      }, 'Dispatched — stock is now in transit');
    }});
}
function receiveTransfer(id) {
  const t = S.transfers.find(x => x.id === id);
  openModal('Receive ' + t.no + (t.invoice ? ' · invoice ' + t.invoice.no : '') + ' from ' + locName(t.from),
    '<div class="tbl"><table><tr><th>Item</th><th class="r">Sent</th><th class="r">Received</th><th>If short: reason</th></tr>' +
    t.lines.map(l => { const it = item(l.item); return '<tr><td>' + esc(it.name) + ' <span class="muted">' + it.unit + '</span></td><td class="r mono">' + qf(l.disp) + '</td><td class="r"><input class="num" type="number" min="0" step="any" data-rq="' + l.item + '" value="' + l.disp + '"></td><td>' + listSelect('shortage', null, null, ' data-rr="' + l.item + '"') + '</td></tr>'; }).join('') + '</table></div><div class="muted" style="margin-top:8px">Received stock keeps its original batch, receive date, expiry and cost. Any shortage is recorded as a transfer loss and sent for approval.</div>',
    {submit: 'Confirm receipt', onSubmit: () => {
      const vals = {}, why = {}; document.querySelectorAll('[data-rq]').forEach(i => vals[i.dataset.rq] = +i.value || 0); document.querySelectorAll('[data-rr]').forEach(i => why[i.dataset.rr] = i.value);
      return act(d => { need('tr.receive'); const x = d.transfers.find(y => y.id === id); needLoc(x.to);
        if (x.status !== 'in_transit') throw new Error('Nothing in transit for this transfer.');
        let short = false;
        x.lines.forEach(l => { const q = vals[l.item];
          if (q > l.disp + EPS) throw new Error(item(l.item).name + ': cannot receive more than was sent (' + qf(l.disp) + ').');
          let left = q;
          l.alloc.forEach(a => { if (left <= EPS) return; const take = r2(Math.min(a.qty, left)); left = r2(left - take);
            receiveIn({type: 'TRANSFER_IN', item: l.item, loc: x.to, qty: take, cost: a.cost, exp: a.exp, recv: a.recv, ref: x.no + ' ← ' + locName(x.from), origin: a.code}); });
          l.rcv = q;
          const diff = r2(l.disp - q);
          if (diff > EPS) { short = true; const val = diff * (l.alloc[l.alloc.length - 1] || {cost: item(l.item).cost}).cost;
            d.discrepancies.push({id: 'x' + next('DSC'), transfer: x.no, item: l.item, loc: x.to, qty: diff, value: r2(val), reason: why[l.item], by: CUR.id, at: new Date().toISOString(), status: 'pending'});
            postTxn({type: 'TRANSFER_LOSS', itemId: l.item, locId: x.to, qty: 0, alloc: [], value: val, ref: x.no, reason: why[l.item] + ' · ' + qf(diff) + ' ' + item(l.item).unit + ' not received (record only; stock already left source)'}); }
        });
        x.status = short ? 'discrepancy' : 'received'; x.rcvBy = CUR.id;
        audit('Transfer received', x.no, short ? 'Received with shortages — sent for approval' : 'Received in full');
      }, 'Transfer received');
    }});
}

function decide(kind, id, ok) {

    if (kind === 'waste') { need('waste.approve'); const w = d.waste.find(x => x.id === id); notSelf(w.by); if (w.status !== 'pending') throw new Error('Already processed.');

      w.apprBy = CUR.id; audit('Waste ' + (ok ? 'approved' : 'rejected'), w.no, item(w.item).name + ' ' + qf(w.qty)); }
    if (kind === 'adj') { need('adj.approve'); const a = d.adjs.find(x => x.id === id); notSelf(a.by); if (a.status !== 'pending') throw new Error('Already processed.');

  }, ok ? 'Approved' : 'Rejected');
}

function distTotals() {

function planValue(plan) { return r2(Object.values(plan).flat().reduce((a, x) => a + x.qty * (item(x.item) || {cost: 0}).cost, 0)); }

  if (!Object.keys(plan).length) throw new Error('Nothing to distribute — all quantities are zero.');

function dispatchPlan(d, plan, plannedBy, planNo) {
  const C = centralId(); checkPlan(plan); const nos = [];
  Object.entries(plan).forEach(([b, lines]) => {

const hasPerm = (u, p) => { const r = ROLES[u.role]; return r.perms === '*' || r.perms.includes(p); };

  if (ds.lotDispose) return act(d => { need('lot.manage'); const l = d.lots.find(x => x.id === ds.lotDispose); const q = l.rem; if (q <= EPS) throw new Error('Nothing left in this lot.');
    postTxn({type: 'EXPIRED_WRITE_OFF', itemId: l.item, locId: l.loc, qty: -q, alloc: [{lot: l.id, code: l.code, qty: q, cost: l.cost}], value: q * l.cost, ref: 'Write-off ' + l.code, reason: lotStatus(l)});
    l.rem = 0; l.status = 'disposed'; audit('Lot written off', l.code, item(l.item).name + ' ' + qf(q) + ' · ' + locName(l.loc) + ' · ' + tk(q * l.cost)); }, 'Lot written off');
  if (ds.lotQ) return act(d => { need('lot.manage'); const l = d.lots.find(x => x.id === ds.lotQ); l.status = 'quarantined'; audit('Lot quarantined', l.code, item(l.item).name + ' · ' + locName(l.loc)); }, 'Lot quarantined — excluded from use');
  if (ds.lotRel) return act(d => { need('lot.manage'); const l = d.lots.find(x => x.id === ds.lotRel); l.status = 'active'; audit('Lot released', l.code, item(l.item).name); }, 'Lot released');
});
document.addEventListener('input', e => {
  if (e.target.id === 'ledgerQ') { const q = e.target.value.toLowerCase(); document.querySelectorAll('#ledgerT tr').forEach((tr, i) => { if (i) tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none'; }); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) closeModal(); });
$('#userSel').onchange = e => { NOTIF_OPEN = false; const np = $('#notifPanel'); np && np.remove(); CUR = S.users.find(u => u.id === e.target.value); LOC = 'all'; if (VIEW === 'audit' && !can('audit')) VIEW = 'dashboard'; render(); toast('Now signed in as ' + CUR.name + ' (' + ROLES[CUR.role].label + ')'); };
$('#locSel').onchange = e => { LOC = e.target.value; render(); };
$('#menuBtn').onclick = () => { $('#side').classList.toggle('open'); $('#backdrop').classList.toggle('on', $('#side').classList.contains('open')); };
$('#backdrop').onclick = () => { $('#side').classList.remove('open'); $('#backdrop').classList.remove('on'); };
document.addEventListener('click', e => { const k = e.target.closest('[data-kpi]'); if (!k) return; e.preventDefault(); VIEW = k.dataset.kpi; render(); $('#content').scrollTop = 0; });
document.addEventListener('keydown', e => { const k = e.target.closest && e.target.closest('[data-kpi]'); if (k && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); VIEW = k.dataset.kpi; render(); } });

function fixUser() { const p = prefs(); CUR = S.users.find(u => u.id === (CUR ? CUR.id : p.user)) || S.users[0]; }

/* ============ Boot ============ */
(function boot() {
  try { const th = localStorage.getItem('stockline_theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  const p = prefs();
  S = loadLocal();
  S = migrate(S);
  if (!S) { S = seed(); S.rev = 1; }
  D = null;
  setTimeout(identify, 0);
  CUR = S.users.find(u => u.id === p.user) || S.users[0];
  VIEW = p.view && VIEWS[p.view] ? p.view : 'dashboard';
  LOC = p.loc || 'all';
  render();
  connectDb();
})();
</script>
</body>
